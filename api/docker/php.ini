; Production PHP settings for Kai's Coffee API on Render

; ── OPcache ───────────────────────────────────────────────────────────────────
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.revalidate_freq=60
opcache.validate_timestamps=0  ; set to 1 if you hot-patch files on the server

; ── Limits ────────────────────────────────────────────────────────────────────
upload_max_filesize=20M
post_max_size=22M
max_execution_time=60
memory_limit=256M

; ── Error reporting ───────────────────────────────────────────────────────────
; Errors are captured by APP_DEBUG in Laravel — don't expose them in PHP itself
display_errors=Off
log_errors=On
error_log=/dev/stderr
