; Production PHP settings for Kai's Coffee API

; ── OPcache ───────────────────────────────────────────────────────────────────
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; In Docker, files only change when a new image is built.
; validate_timestamps=0 means PHP never stats the disk — correct here.
opcache.validate_timestamps=0
; revalidate_freq is ignored when validate_timestamps=0. Set to 0 to be explicit.
opcache.revalidate_freq=0

; ── JIT (PHP 8.4) ─────────────────────────────────────────────────────────────
; "tracing" mode gives the best speedup for Laravel's request-per-process model.
opcache.jit=tracing
opcache.jit_buffer_size=64M

; ── Limits ────────────────────────────────────────────────────────────────────
; Keep upload_max_filesize < post_max_size so PHP can read the rest of the form.
; Keep post_max_size <= nginx client_max_body_size (currently 22M) or nginx
; will reject the request before PHP ever sees it.
upload_max_filesize=20M
post_max_size=22M
max_execution_time=60
memory_limit=256M

; ── Error reporting ───────────────────────────────────────────────────────────
; Errors surface through APP_DEBUG in Laravel — don't duplicate them in PHP output.
display_errors=Off
log_errors=On
error_log=/dev/stderr
