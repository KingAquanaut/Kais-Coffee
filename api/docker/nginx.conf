worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to stdout/stderr so Render captures them
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Render injects $PORT; default to 80 if not set (local Docker testing)
    server {
        listen ${PORT:-80};
        server_name _;
        root /var/www/html/public;
        index index.php;

        # PHP files → php-fpm
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;
            fastcgi_read_timeout 300;
        }

        # Everything else → Laravel's front controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Block dot-files (.env, .git, etc.)
        location ~ /\. {
            deny all;
        }

        # Block direct access to storage (already served via /storage symlink)
        location ~* ^/storage/ {
            deny all;
        }
    }
}
