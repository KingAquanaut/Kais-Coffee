worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to stdout/stderr so Render / Railway / Fly.io capture them
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    server {
        listen ${PORT};
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Must match php.ini post_max_size (currently 22 M).
        # Without this nginx rejects large uploads with 413 before PHP sees them.
        client_max_body_size 22M;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header X-XSS-Protection       "1; mode=block"                    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        # Enable once HTTPS is confirmed end-to-end:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── PHP files → php-fpm ──────────────────────────────────────────────
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass         127.0.0.1:9000;
            fastcgi_index        index.php;
            fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header  X-Powered-By;
            include              fastcgi_params;
            # Match max_execution_time in php.ini — no point waiting longer.
            fastcgi_read_timeout 60;
            fastcgi_buffers      16 16k;
            fastcgi_buffer_size  32k;
        }

        # ── Everything else → Laravel front controller ───────────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Block dot-files (.env, .git, etc.)
        location ~ /\. {
            deny all;
        }

        # Block direct access to storage (served via /storage symlink if needed)
        location ~* ^/storage/ {
            deny all;
        }
    }
}
