worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Don't advertise nginx version in Server header or error pages.
    server_tokens off;

    # Include request time (rt=) for latency visibility in Render log viewer.
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent rt=${request_time}s';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 10 req/min per IP on auth endpoints (burst of 5 served immediately,
    # excess rejected with 429 — not queued — to avoid latency pile-up).
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    server {
        listen ${PORT};
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Must match php.ini post_max_size (currently 22 M).
        # Without this nginx rejects large uploads with 413 before PHP sees them.
        client_max_body_size 22M;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"                             always;
        add_header X-Content-Type-Options "nosniff"                                always;
        add_header X-XSS-Protection       "1; mode=block"                          always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"        always;
        # Render provides HTTPS termination — HSTS is safe to enable.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Disable browser APIs this app doesn't need.
        add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()" always;

        # Block dot-files (.env, .git, etc.) — must be first to take priority.
        location ~ /\. {
            deny all;
        }

        # Block direct access to storage (served via /storage symlink if needed).
        location ~* ^/storage/ {
            deny all;
        }

        # ── Auth endpoints — rate limited ─────────────────────────────────────
        # Prevents credential stuffing on login and spam on register.
        location ~ ^/api/v1/auth/(login|register) {
            limit_req zone=auth burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # ── Static assets — long-lived cache ─────────────────────────────────
        # Fingerprinted assets (css/js/images) are safe to cache forever.
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── PHP files → php-fpm ──────────────────────────────────────────────
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass         127.0.0.1:9000;
            fastcgi_index        index.php;
            fastcgi_param        SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Httpoxy mitigation: clear HTTP_PROXY so PHP can't be hijacked.
            fastcgi_param        HTTP_PROXY "";
            fastcgi_hide_header  X-Powered-By;
            include              fastcgi_params;
            # Match max_execution_time in php.ini — no point waiting longer.
            fastcgi_read_timeout 60;
            fastcgi_buffers      16 16k;
            fastcgi_buffer_size  32k;
        }

        # ── Everything else → Laravel front controller ───────────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }
}
