; Production php-fpm pool overrides for Kai's Coffee API.
; This file is loaded last (zzz- prefix) so it takes precedence over www.conf.
;
; Tuning notes:
;   - pm.max_children × memory_limit must fit in instance RAM.
;     At 256M limit and 10 workers: up to ~2.5 GB theoretical max.
;     Actual RSS per worker is typically 40–80 MB for a Laravel app.
;   - pm.max_requests recycles workers after N requests, preventing
;     slow memory leaks from accumulating over hours/days.

[www]
; Dynamic: idle workers exit when traffic is low (saves RAM).
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle each worker after 500 requests — prevents memory leak accumulation.
pm.max_requests = 500
