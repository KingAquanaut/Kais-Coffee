name: Staging — Deploy

# ── Trigger ────────────────────────────────────────────────────────────────────
# Runs on every push to `develop` and on manual dispatch.
#
# Stack:
#   API  → Render (Docker, kais-coffee-api-staging service)
#   Web  → Vercel (Next.js, preview environment)
#
# Prerequisites (one-time setup):
#   GitHub Secrets (Settings → Secrets → Actions):
#     RENDER_STAGING_DEPLOY_HOOK     Deploy hook URL from Render dashboard
#     VERCEL_TOKEN                   Vercel personal/team token
#     VERCEL_ORG_ID                  From Vercel project settings → General
#     VERCEL_PROJECT_ID              From Vercel project settings → General
#     NEXT_PUBLIC_API_URL_STAGING    https://kais-coffee-api-staging.onrender.com/api/v1
#
#   GitHub Environment (Settings → Environments → staging):
#     No required reviewers needed for staging (fast feedback loop).
#     Add reviewers here if your team wants approval before staging deploys.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  # Cancel older staging runs when a new commit arrives — only latest matters.
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "20"

jobs:
  # ── 1a. Laravel API tests ────────────────────────────────────────────────────
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kais_coffee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, json
          coverage: none

      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "DB_CONNECTION=pgsql"           >> .env
          echo "DB_HOST=127.0.0.1"             >> .env
          echo "DB_PORT=5432"                  >> .env
          echo "DB_DATABASE=kais_coffee_test"  >> .env
          echo "DB_USERNAME=postgres"          >> .env
          echo "DB_PASSWORD=secret"            >> .env

      - run: php artisan migrate --force
      - run: php artisan test

  # ── 1b. Next.js lint + type-check ────────────────────────────────────────────
  # This job validates code quality. The actual production build happens inside
  # `vercel build` in the deploy-web job (Vercel rebuilds with its own toolchain).
  build-web:
    name: Web — lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

      - name: Verify build
        # Use a localhost placeholder so next/image remotePatterns don't fail.
        # The real NEXT_PUBLIC_API_URL is injected by Vercel during deploy-web.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_APP_NAME: "Kai's Coffee"
        run: npm run build

  # ── 2. Deploy API to Render (staging) ────────────────────────────────────────
  # Fires the Render deploy hook, then polls /api/v1/health until the new
  # container is live (up to 5 min). Render holds the old container until the
  # new one passes its health check — zero-downtime swap.
  deploy-api:
    name: Deploy API → Render staging
    needs: [test-api, build-web]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Trigger Render staging deploy
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}")
          echo "Render response: $response"

      - name: Wait for staging API health
        run: |
          echo "Polling staging API health (max 5 min)..."
          for i in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              https://kais-coffee-api-staging.onrender.com/api/v1/health || echo "000")
            echo "  Attempt $i/30: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Staging API is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Staging API did not become healthy within 5 minutes."
          exit 1

  # ── 3. Deploy Web to Vercel (staging preview) ─────────────────────────────────
  # Uses the official Vercel CLI (vercel pull → vercel build → vercel deploy).
  #
  # NEXT_PUBLIC_API_URL_STAGING is injected after `vercel pull` so it takes
  # precedence over any value already in the Vercel dashboard for this env.
  # This makes the secret the single source of truth for the staging API URL.
  #
  # The deployed URL is printed at the end of this job for easy access.
  deploy-web:
    name: Deploy Web → Vercel staging
    needs: [test-api, build-web]
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        # Pin to a major version so you get patch fixes but not breaking changes.
        run: npm install --global vercel@latest

      # Pull project metadata (.vercel/project.json) and environment variable
      # files (.vercel/.env.preview.local) from Vercel. Required before build.
      - name: Pull Vercel project settings (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Append our secret AFTER pulling so it wins over the dashboard value.
      # `echo >>` is safe even if the file doesn't have a trailing newline.
      - name: Inject staging API URL
        run: |
          echo "" >> .vercel/.env.preview.local
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_STAGING }}" >> .vercel/.env.preview.local

      # `vercel build` compiles Next.js using the pulled env vars (including our
      # injected NEXT_PUBLIC_API_URL). Output goes to .vercel/output/.
      - name: Build (vercel build)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `--prebuilt` ships the .vercel/output/ directory without rebuilding.
      # The deploy URL is captured so we can log it and optionally alias it.
      - name: Deploy to Vercel preview
        id: deploy
        run: |
          deploy_url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$deploy_url" >> $GITHUB_OUTPUT
          echo "Deployed to: $deploy_url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Optional: assign a stable staging alias so you always have a fixed URL.
      # Requires the domain to be added and verified in your Vercel project first.
      # Comment this step out if you haven't configured the alias domain yet.
      - name: Alias to staging domain
        run: |
          vercel alias set \
            "${{ steps.deploy.outputs.deploy_url }}" \
            staging.kaiscoffee.com \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # Don't fail the whole workflow if aliasing fails (domain not yet set up).
        continue-on-error: true
