name: Production — Deploy

# ── Trigger ────────────────────────────────────────────────────────────────────
# Runs on push to `main` and on manual dispatch.
#
# The `deploy-api` and `deploy-web` jobs sit behind the "production" GitHub
# Environment. Configure Required Reviewers there to enforce manual approval
# before any production deploy goes live (Settings → Environments → production).
#
# Stack:
#   API  → Render (Docker, kais-coffee-api-production service)
#   Web  → Vercel (Next.js, production environment)
#
# Prerequisites (one-time setup):
#   GitHub Secrets (Settings → Secrets → Actions):
#     RENDER_PROD_DEPLOY_HOOK      Deploy hook URL from Render dashboard
#     VERCEL_TOKEN                 Vercel personal/team token
#     VERCEL_ORG_ID                From Vercel project settings → General
#     VERCEL_PROJECT_ID            From Vercel project settings → General
#     NEXT_PUBLIC_API_URL_PROD     https://kais-coffee-api.onrender.com/api/v1
#
#   GitHub Environment (Settings → Environments → production):
#     Add Required Reviewers to gate all production deploys behind approval.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  # Never cancel an in-flight production deploy — let it finish.
  cancel-in-progress: false

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "20"

jobs:
  # ── 1a. Laravel API tests ────────────────────────────────────────────────────
  test-api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kais_coffee_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, json
          coverage: none

      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "DB_CONNECTION=pgsql"           >> .env
          echo "DB_HOST=127.0.0.1"             >> .env
          echo "DB_PORT=5432"                  >> .env
          echo "DB_DATABASE=kais_coffee_test"  >> .env
          echo "DB_USERNAME=postgres"          >> .env
          echo "DB_PASSWORD=secret"            >> .env

      - run: php artisan migrate --force
      - run: php artisan test

  # ── 1b. Next.js lint + type-check ────────────────────────────────────────────
  build-web:
    name: Web — lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

      - name: Verify build
        # Placeholder URL keeps the CI build self-contained.
        # The real NEXT_PUBLIC_API_URL is injected by Vercel during deploy-web.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_APP_NAME: "Kai's Coffee"
        run: npm run build

  # ── 2. Deploy API to Render (production) ─────────────────────────────────────
  # This job is gated by the "production" GitHub Environment.
  # If Required Reviewers are configured, the workflow pauses here until
  # a reviewer approves — no code reaches prod without human sign-off.
  #
  # After approval, Render builds a new Docker image from main, runs
  # entrypoint.sh (php artisan migrate --force), and shifts traffic once
  # the health check passes. The old container stays live until then.
  deploy-api:
    name: Deploy API → Render production
    needs: [test-api, build-web]
    runs-on: ubuntu-latest
    environment: production   # ← approval gate lives here

    steps:
      - name: Trigger Render production deploy
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --request POST \
            "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}")
          echo "Render response: $response"

      - name: Wait for production API health
        # Poll up to 6 min (36 × 10s). Production deploy on Render starter plan
        # is typically 2–4 min including Docker build + migration.
        run: |
          echo "Polling production API health (max 6 min)..."
          for i in $(seq 1 36); do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              https://kais-coffee-api.onrender.com/api/v1/health || echo "000")
            echo "  Attempt $i/36: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Production API is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Production API did not become healthy within 6 minutes."
          exit 1

  # ── 3. Deploy Web to Vercel (production) ──────────────────────────────────────
  # Uses the official Vercel CLI (vercel pull → vercel build → vercel deploy --prod).
  # Runs in parallel with deploy-api — both need tests to pass, not each other.
  #
  # NEXT_PUBLIC_API_URL_PROD is injected after `vercel pull` so it takes
  # precedence over any value already in the Vercel dashboard. This makes
  # the GitHub Secret the single source of truth for the production API URL.
  deploy-web:
    name: Deploy Web → Vercel production
    needs: [test-api, build-web]
    runs-on: ubuntu-latest
    environment: production   # same gate — both jobs require approval

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (includes vercel CLI)
        run: npm ci && npm install vercel@latest

      - name: Debug — verify toolchain
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "node: $(which node)"
          echo "npm:  $(which npm)"
          echo "vercel: $(npx vercel --version)"

      # Pull project metadata and the production environment variable file
      # (.vercel/.env.production.local) from Vercel. Required before build.
      - name: Pull Vercel project settings (production)
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Append our secret AFTER pulling so it wins over the dashboard value.
      - name: Inject production API URL
        run: |
          echo "" >> .vercel/.env.production.local
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_PROD }}" >> .vercel/.env.production.local

      # Build using the pulled env vars. Output goes to .vercel/output/.
      # VERCEL_BUILD_SKIP_INSTALL=1 prevents vercel from running `npm ci`
      # again inside its own subprocess (which is where spawn npm ENOENT fires).
      - name: Build (vercel build --prod)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_BUILD_SKIP_INSTALL: 1

      # Ship the prebuilt output. --prod promotes this to the production domain.
      - name: Deploy to Vercel production
        id: deploy
        run: |
          deploy_url=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$deploy_url" >> $GITHUB_OUTPUT
          echo "Deployed to: $deploy_url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
